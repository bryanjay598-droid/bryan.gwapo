<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5e9e5">
<title>PROJECT_CC</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; padding: 22px; display: grid;
    place-items: center; background: linear-gradient(145deg, #f6e9e4, #e9d8d2);
    color: #604d4a; font-family: Georgia, "Times New Roman", serif;
}
.card {
    width: min(100%, 540px); background: #fffaf7; border: 1px solid #e6d3cc;
    border-radius: 18px; padding: 30px 25px; box-shadow: 0 18px 45px #795e5520;
}
.screen { text-align: center; }
.heart { font-size: 38px; color: #c58f91; margin-bottom: 12px; }
h1 { font-weight: normal; font-size: 27px; margin: 8px 0 12px; }
.sub { font-size: 14px; line-height: 1.8; color: #927b75; }
input {
    width: 100%; margin: 22px 0 13px; padding: 14px 15px;
    border: 1px solid #dfc7c0; border-radius: 10px; background: #fffdfb;
    color: #604d4a; font: 16px Georgia, serif; outline: none; text-align: center;
}
input:focus { border-color: #bd8f8b; box-shadow: 0 0 0 3px #bd8f8b20; }
button {
    border: 0; border-radius: 25px; padding: 12px 22px;
    background: #bd8f8b; color: white; font: 15px Georgia, serif; cursor: pointer;
}
#letterScreen { display: none; }
.letterHead { text-align: center; margin-bottom: 22px; }
.letterHead small {
    letter-spacing: 2px; text-transform: uppercase; color: #b28b85; font-size: 10px;
}
#typedText {
    min-height: 320px; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 15px; line-height: 1.95; color: #5f504c;
}
.cursor {
    display: inline-block; width: 1px; height: 17px; background: #b98180;
    vertical-align: middle; margin-left: 2px; animation: blink .8s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.secondary { background: #e8d6d0; color: #765e58; }
.note { text-align: center; margin-top: 22px; font-size: 11px; color: #b49a92; }
.error { display: none; color: #b56f70; font-size: 13px; margin-top: 14px; }
@media(max-width: 380px) {
    .card { padding: 25px 19px; }
    #typedText { font-size: 14px; line-height: 1.85; }
}
</style>
</head>
<body>
<main class="card">
    <section id="nameScreen" class="screen">
        <div class="heart">♡</div>
        <h1>someone special</h1>
        <p class="sub">before you read this letter,<br>tell me… what's your name?</p>
        <input id="crushName" type="text" maxlength="35"
               placeholder="type your name here..." autocomplete="off">
        <button id="beginBtn" type="button">continue ♡</button>
        <p id="errorMessage" class="error">wrong name! this letter isn't for you. ♡</p>
        <p class="note">a little letter, written from the heart</p>
    </section>

    <section id="letterScreen">
        <header class="letterHead">
            <small>a letter just for you</small>
            <h1>dear <span id="nameOutput">you</span>,</h1>
        </header>
        <div id="typedText"></div>
        <span class="cursor" id="cursor"></span>
        <div class="actions">
            <button id="replayBtn" class="secondary" type="button">replay letter ↻</button>
        </div>
        <p class="note">written with honesty ♡</p>
    </section>
</main>

<script>
const confession = `hiii, naa unta koy gusto isulti nimo nga dugay na gyud nako gusto i share, pero wala lang gyud ko nakakita og sakto nga time ug courage para isulti ni. since elementary pa ta, naa na gyud koy feelings para nimo. sauna, wala ra nako gi mind kay abi nako simple crush ra ni nga mawala ra kadugayan. pero as time passed, na realize nako nga wala diay siya nawala. daghan na ang nausab since then, ug dili na pud ta parehas ka close sauna, pero naa gihapon akong feelings para nimo. if ever naka notice ka nga usahay murag wala tika tagda or maglikay ko nimo, i'm really sorry about that. dili gyud to tungod kay dili ko ganahan makig istorya nimo or wala koy gana makig interact nimo. usahay ma awkward lang gyud ko kay dili ko kabalo unsaon pag act around you, especially knowing nga naa koy feelings para nimo. i hope wala nimo na misunderstood akong actions sauna. i also want to thank you sa mga little things nga imong gibuhat para nako. especially sa mga times nga gina librehan ko nimo and sa mga moments nga magkauban ta. basin simple ra to para nimo, pero i really appreciate those things more than you think. honestly, dugay na kaayo ni nako gusto isulti, pero karon pa gyud ko nakakuha og courage. i'm not telling you this because naa koy gi expect nga mahitabo between us. dili pud ko nangayo og answer or expecting you to feel the same way. gusto lang gyud nako nga ma express akong feelings nga dugay na nako gitago. i hope nga dili ka ma pressure after nimo mabasa ni, and i hope nga dili pud ni mahimong reason para ma awkward ta sa usag usa. i still value our friendship, and i don't want you to feel nga kinahanglan naay mausab tungod lang kay ni open up ko nimo. i don't know if you ever noticed how special you are to me, but i hope you know that i genuinely appreciate having you in my life. i never regretted meeting you, and even though time has changed a lot of things between us, i'm still glad that we got to share those memories together. whatever happens, i'm still happy nga naka ilaila ko nimo. you've been someone special to me for a long time, and i just thought nga deserve nimo mahibaw an unsa ka ka special para nako. that's all. i just wanted to be honest with you, finally. also, i hope nga this stays between us lang. personal ni para nako, and i would really appreciate it if dili na nato i share sa uban. gusto lang nako nga kita ra duha ang makahibalo ani.`;

const nameInput = document.getElementById("crushName");
const output = document.getElementById("typedText");
const cursor = document.getElementById("cursor");
let timer = null;
let index = 0;

function startTyping() {
    clearInterval(timer);
    index = 0;
    output.textContent = "";
    cursor.style.display = "inline-block";
    timer = setInterval(() => {
        output.textContent += confession.charAt(index);
        index++;
        if (index >= confession.length) {
            clearInterval(timer);
            cursor.style.display = "none";
        }
    }, 50);
}

function begin() {
    const name = nameInput.value.trim();
    const errorMessage = document.getElementById("errorMessage");
    if (name.toLowerCase() !== "zaira") {
        errorMessage.style.display = "block";
        nameInput.focus();
        return;
    }
    errorMessage.style.display = "none";
    document.getElementById("nameOutput").textContent = name;
    document.getElementById("nameScreen").style.display = "none";
    document.getElementById("letterScreen").style.display = "block";
    startTyping();
}

document.getElementById("beginBtn").addEventListener("click", begin);
nameInput.addEventListener("keydown", event => {
    if (event.key === "Enter") begin();
});
nameInput.addEventListener("input", () => {
    document.getElementById("errorMessage").style.display = "none";
});
document.getElementById("replayBtn").addEventListener("click", startTyping);
</script>
</body>
</html>
